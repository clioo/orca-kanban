[package]
name = "work-board-svc"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
croner = "=4.0.0"
getrandom = "=0.4.3"
hmac = "=0.12.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12.0"
url = "=2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"

[profile.release]
strip = true
